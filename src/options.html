<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LC Dev options</title>
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        margin: 24px;
        max-width: 420px;
        color: #1a1a1a;
      }
      label { display: block; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      button { margin-top: 8px; font: inherit; }
      #msg { min-height: 1.4em; }
    </style>
  </head>
  <body>
    <h1>LC Dev</h1>
    <p>
      Fine-grained GitHub token for <code>lambda-curry/360training</code> with
      Issues read/write and Pull requests read. Used to find PRs and to add the
      <code>currybot-review</code> label or comment.
    </p>
    <form id="form">
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" />
      <button type="submit">Save</button>
    </form>
    <p id="msg"></p>
    <script src="options.js"></script>
  </body>
</html>
